services:
  app:
    build: .
    container_name: campus-web-app
    restart: always
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:?请在项目根目录 .env 中配置 DB_PASSWORD}
      - DB_NAME=campus_club
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:?请在项目根目录 .env 中配置 JWT_SECRET}
      - NODE_ENV=production
    volumes:
      - ./public:/app/public
      - ./src:/app/src
      - ./server.js:/app/server.js
      - campus_uploads_data:/app/uploads
      - campus_db_data:/app/data

volumes:
  campus_uploads_data:
    name: campus_uploads_data
  campus_db_data:
    name: campus_db_data
