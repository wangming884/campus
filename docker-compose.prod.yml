services:
  app:
    image: your-registry/campus-club:latest
    container_name: campus-web-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=your_mysql_password
      - DB_NAME=campus_club
      - PORT=3000
      - JWT_SECRET=change_me_to_random_string
      - NODE_ENV=production
    volumes:
      - campus_uploads_data:/app/uploads

volumes:
  campus_uploads_data:
    name: campus_uploads_data