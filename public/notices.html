<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>通知公告与活动沙龙 - 高校学生社团官方门户</title>
  <meta name="description" content="查看社团官方招新通知、前沿技术沙龙预告、大型比赛组队公告及社团成员专享内部规章。">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/portal.css">
  <style>
    .notices-filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }
    .filter-pills {
      display: flex;
      gap: 8px;
    }
    .filter-pill {
      padding: 8px 18px;
      border-radius: var(--radius-full);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text-muted);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
      position: relative;
    }
    .filter-pill:hover {
      border-color: var(--primary);
      color: var(--primary);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.12);
    }
    .filter-pill.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 4px 14px var(--primary-glow);
    }
    .notice-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px 28px;
      margin-bottom: 18px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      animation: noticeCardIn 0.4s ease-out backwards;
      position: relative;
      overflow: hidden;
    }
    @keyframes noticeCardIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .notice-card:hover {
      border-color: var(--primary);
      box-shadow: 0 12px 32px -8px rgba(37, 99, 235, 0.15);
      transform: translateY(-3px);
    }
    .notice-card::after {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 100px; height: 100px;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.03) 0%, transparent 70%);
      border-radius: 0 0 0 100px;
      pointer-events: none;
      transition: opacity 0.3s ease;
      opacity: 0;
    }
    .notice-card:hover::after {
      opacity: 1;
    }
  </style>
</head>
<body>

  <header id="shared-header" class="portal-header"></header>

  <!-- 页面横幅 -->
  <div class="page-banner">
    <div class="container">
      <span class="page-banner-badge">INFORMATION DESK</span>
      <h1 class="page-banner-title">社团官方通知公告中心</h1>
      <p class="page-banner-desc">
        第一时间获取全校招新宣讲会动态、学术技术沙龙日程安排、竞赛组队通知与社内专属规章资源。
      </p>
    </div>
  </div>

  <section class="section">
    <div class="container" style="max-width: 980px;">
      
      <!-- 检索与分类工具条 -->
      <div class="notices-filter-bar">
        <div class="filter-pills">
          <div class="filter-pill active" onclick="setNoticeCategory('all', this)">全部通告</div>
          <div class="filter-pill" onclick="setNoticeCategory('public', this)">🌐 全校公开</div>
          <div class="filter-pill" onclick="setNoticeCategory('member', this)">🔒 社内成员专享</div>
        </div>

        <div style="display: flex; gap: 8px;">
          <input type="text" class="form-control" id="notice-search-input" placeholder="搜索公告标题或标签..." style="width: 260px;" onkeyup="if(event.key==='Enter') loadNoticesList()">
          <button class="btn btn-outline" onclick="loadNoticesList()">🔍 搜索</button>
        </div>
      </div>

      <!-- 列表容器 -->
      <div id="notices-cards-container">
        <div style="text-align: center; padding: 40px; color: var(--text-muted);">正在加载公告列表...</div>
      </div>

    </div>
  </section>

  <!-- 查看通知详情弹窗 -->
  <div class="modal-overlay" id="modal-notice-view">
    <div class="modal-container" style="max-width: 680px;">
      <div class="modal-header">
        <h3 class="modal-title" id="notice-detail-title">通知详情</h3>
        <button class="modal-close" onclick="closeModal('modal-notice-view')">&times;</button>
      </div>
      <div class="modal-body">
        <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 18px; font-size: 13.5px; color: var(--text-muted); flex-wrap: wrap;">
          <span id="notice-detail-badge"></span>
          <span id="notice-detail-date"></span>
          <span id="notice-detail-author"></span>
          <span id="notice-detail-views"></span>
        </div>
        <div id="notice-detail-content" style="line-height: 1.85; color: #334155; font-size: 15.5px; white-space: pre-wrap;"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeModal('modal-notice-view')">关闭</button>
      </div>
    </div>
  </div>

  <footer id="shared-footer" class="portal-footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    let currentCategory = 'all';
    let noticesData = [];

    document.addEventListener('DOMContentLoaded', () => {
      loadNoticesList();
    });

    function setNoticeCategory(cat, el) {
      currentCategory = cat;
      document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
      el.classList.add('active');
      loadNoticesList();
    }

    async function loadNoticesList() {
      const container = document.getElementById('notices-cards-container');
      const keyword = document.getElementById('notice-search-input').value.trim();

      container.innerHTML = `<div style="text-align:center; padding: 40px; color: var(--text-muted);">加载中...</div>`;

      try {
        let url = `/notices?category=${currentCategory}`;
        if (keyword) url += `&keyword=${encodeURIComponent(keyword)}`;

        const res = await apiRequest(url);
        if (res.success && Array.isArray(res.data)) {
          noticesData = res.data;

          if (noticesData.length === 0) {
            container.innerHTML = `
              <div style="text-align: center; padding: 60px 20px; background: #ffffff; border-radius: var(--radius-lg); border: 1px dashed #cbd5e1;">
                <div style="font-size: 42px; margin-bottom: 12px;">📭</div>
                <h4 style="font-size: 18px; font-weight: 700; color: #1e293b; margin-bottom: 6px;">暂无相关公告记录</h4>
                <p style="font-size: 14px; color: var(--text-muted);">请更换筛选分类或输入其他关键词重新检索</p>
              </div>
            `;
            return;
          }

          container.innerHTML = noticesData.map((n, i) => `
            <div class="notice-card" style="animation-delay: ${i * 0.08}s" onclick="openNoticeModalById(${n.id})">
              <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 10px;">
                <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                  <span class="badge ${n.category === 'member' ? 'badge-super' : 'badge-admin'}">
                    ${n.category === 'member' ? '🔒 社团成员专享' : '🌐 全校公开'}
                  </span>
                  <span class="badge badge-user">${escapeHtml(n.tag || '通告')}</span>
                  <h3 style="font-size: 18px; font-weight: 750; color: #0f172a; margin: 0;">${escapeHtml(n.title)}</h3>
                </div>
                <span style="font-size: 13px; color: var(--text-light); white-space: nowrap;">${formatDateTime(n.created_at)}</span>
              </div>

              <p style="font-size: 14.5px; color: #475569; line-height: 1.65; margin-bottom: 16px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
                ${escapeHtml(n.content)}
              </p>

              <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-light); padding-top: 12px; font-size: 13px; color: var(--text-muted);">
                <span>发布人: <strong>${escapeHtml(n.author_name || '管理组')}</strong> · 浏览量: ${n.views || 0} 次</span>
                <span style="color: var(--primary); font-weight: 700;">点击阅读全文 &rarr;</span>
              </div>
            </div>
          `).join('');
        }
      } catch (error) {
        container.innerHTML = `<div style="text-align:center; color: var(--danger); padding: 30px;">加载失败: ${error.message}</div>`;
      }
    }

    async function openNoticeModalById(id) {
      try {
        const res = await apiRequest(`/notices/${id}`);
        if (res.success && res.data) {
          const n = res.data;
          document.getElementById('notice-detail-title').innerText = n.title;
          document.getElementById('notice-detail-date').innerText = '发布于 ' + formatDateTime(n.created_at);
          document.getElementById('notice-detail-author').innerText = '发布人: ' + (n.author_name || '管理组');
          document.getElementById('notice-detail-views').innerText = `👁️ ${n.views || 1} 次阅读`;
          document.getElementById('notice-detail-badge').innerHTML = `
            <span class="badge ${n.category === 'member' ? 'badge-super' : 'badge-admin'}">
              ${n.category === 'member' ? '🔒 社内专享' : '🌐 全校公开'}
            </span>
          `;
          document.getElementById('notice-detail-content').innerText = n.content;

          openModal('modal-notice-view');
        }
      } catch (error) {
        showToast(error.message, 'error');
      }
    }
  </script>
</body>
</html>
